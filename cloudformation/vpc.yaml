AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Three-tier WordPress: CloudFront+WAF -> HTTPS ALB (CloudFront IPs only) -> ASG
  in two public subnets; single-AZ MySQL primary + read replica (HyperDB split),
  Redis object cache, EFS wp-content, CloudWatch dashboard/logs. The deploy role
  lives in pipeline.yaml.

Parameters:
  EnvironmentName:
    Type: String
    Default: three-tier-app
    Description: Name prefix used to tag resources.

  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1a
    Description: AZ for public/private subnets and RDS.

  SecondAvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1b
    Description: Second AZ for RDS's subnet group.

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for the VPC.

  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR block for the public subnet.

  PrivateSubnetCidr:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR block for the private subnet.

  PrivateSubnet2Cidr:
    Type: String
    Default: 10.0.3.0/24
    Description: Second private subnet CIDR.

  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.4.0/24
    Description: CIDR for the second public subnet (ALB, ASG).

  DBName:
    Type: String
    Default: appdb
    Description: Initial RDS database name.

  DBUsername:
    Type: String
    Default: admin
    Description: Master username for the RDS instance.
    NoEcho: true

  DBAppUsername:
    Type: String
    Default: wordpress_app
    Description: Least-privilege DB user WordPress actually connects as.
    NoEcho: true

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS instance class.

  DBAllocatedStorage:
    Type: Number
    Default: 20
    Description: RDS storage, in GiB.

  DBEngineVersion:
    Type: String
    Default: '8.4'
    Description: MySQL engine version.

  RedisNodeType:
    Type: String
    Default: cache.t3.micro
    Description: Redis node type (cache.t3.micro is free-tier eligible).

  RedisEngineVersion:
    Type: String
    Default: '7.1'
    Description: Redis engine version for ElastiCache.

  BackupRetentionDays:
    Type: Number
    Default: 30
    Description: Days AWS Backup retains recovery points.

  BackupScheduleExpression:
    Type: String
    Default: cron(0 5 * * ? *)
    Description: AWS Backup cron schedule (UTC).

  DBBackupRetentionPeriod:
    Type: Number
    Default: 1
    Description: RDS backup retention (days); free tier caps at 1

  DBSnapshotIdentifier:
    Type: String
    Default: ''
    Description: Optional RDS snapshot to restore from.

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair name.

  WebServerInstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type.

  SSHLocationCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    Description: CIDR allowed to SSH.

  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: SSM parameter for the latest AL2023 AMI ID.

  AsgMinSize:
    Type: Number
    Default: 2
    Description: Minimum WordPress instances in the ASG.

  AsgMaxSize:
    Type: Number
    Default: 3
    Description: Maximum WordPress instances in the ASG.

  AsgDesiredCapacity:
    Type: Number
    Default: 2
    Description: Desired WordPress instances in the ASG.

  LogRetentionDays:
    Type: Number
    Default: 7
    Description: CloudWatch Logs retention (days)

  CloudFrontOriginFacingPrefixListId:
    Type: String
    Default: pl-3b927c52
    Description: >-
      CloudFront origin-facing prefix list (com.amazonaws.global.cloudfront.origin-facing).
      Restricts the ALB SG to CloudFront IPs, blocking direct hits on the ALB's DNS name.

  CloudFrontPriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
    Description: CloudFront price class (PriceClass_100 default).

  CustomDomainName:
    Type: String
    Default: blog.securecloudengineers.com
    Description: CloudFront custom domain, in Route53HostedZoneId's zone (ACM DNS-validated).

  Route53HostedZoneId:
    Type: String
    Default: Z06930743HC9RLGHJO306
    Description: Existing hosted zone (another stack owns it; only records are added).

Conditions:
  RestoreFromSnapshot: !Not [!Equals [!Ref DBSnapshotIdentifier, '']]

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Ref AvailabilityZone
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-public-subnet

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Ref AvailabilityZone
      CidrBlock: !Ref PrivateSubnetCidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-subnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Ref SecondAvailabilityZone
      CidrBlock: !Ref PublicSubnet2Cidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-public-subnet-2

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Ref SecondAvailabilityZone
      CidrBlock: !Ref PrivateSubnet2Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-subnet-2

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-rt

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # Generated, never supplied by anyone. / @ " and space are RDS-disallowed;
  # ' and \ would break the single-quoted PHP string in db-secret.php.
  # Later rotations: see "Rotate the DB password" in Deployment.md.
  DBMasterSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${EnvironmentName}-db-master
      Description: RDS master credentials; WordPress instances read this at runtime.
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DBUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '/@"''\ '

  # Least-privilege app user WordPress actually connects as (security gap #16) -
  # same character exclusions as DBMasterSecret, for the same reasons.
  DBAppUserSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${EnvironmentName}-db-app
      Description: Least-privilege RDS app credentials; WordPress instances read this at runtime.
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DBAppUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '/@"''\ '

  # ElastiCache AuthToken: printable ASCII only, can't contain / @ " or whitespace.
  RedisAuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${EnvironmentName}-redis-auth
      Description: Redis AUTH token; WordPress instances read this at runtime.
      GenerateSecretString:
        GenerateStringKey: token
        SecretStringTemplate: '{}'
        PasswordLength: 32
        ExcludeCharacters: '/@"''\ '

  # Sent by CloudFront as X-Origin-Verify, so the ALB can reject requests that
  # came through any other CloudFront distribution.
  OriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${EnvironmentName}-origin-verify
      Description: Shared secret header between CloudFront and the ALB.
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub Subnet group for ${EnvironmentName} RDS instance
      SubnetIds:
        - !Ref PrivateSubnet
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-db-subnet-group

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow MySQL access from the web server only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref WebServerSecurityGroup
          Description: MySQL access from the WordPress web server
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-db-sg

  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP from the ALB and SSH access to the WordPress web servers
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: HTTP access from the ALB only
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocationCidr
          Description: SSH access
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-web-sg

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP access to the Application Load Balancer
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-alb-sg

  # 443 only: the 46-entry prefix list uses 46 of the SG's 60 rule slots, so an
  # 80 rule can't fit - and CloudFront's https-only origin never sends port 80.
  ALBSecurityGroupIngressHttpsFromCloudFront:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourcePrefixListId: !Ref CloudFrontOriginFacingPrefixListId
      Description: HTTPS access from CloudFront origin-facing IP ranges only

  ALBLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldAccessLogs
            Status: Enabled
            ExpirationInDays: !Ref LogRetentionDays
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-alb-logs

  # deploy.yml uploads the template here (--s3-bucket) to get past TemplateBody's
  # 51,200-byte limit. Auto-named, so it matches the deploy role's S3 scope.
  CfnArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldTemplates
            Status: Enabled
            ExpirationInDays: 7

  ALBLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ALBLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowELBRootAccountLogDelivery
            Effect: Allow
            Principal:
              AWS: 'arn:aws:iam::127311923021:root'
            Action: s3:PutObject
            Resource: !Sub arn:aws:s3:::${ALBLogsBucket}/alb-logs/AWSLogs/${AWS::AccountId}/*
          - Sid: AllowELBLogDeliveryServicePutObject
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub arn:aws:s3:::${ALBLogsBucket}/alb-logs/AWSLogs/${AWS::AccountId}/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
          - Sid: AllowELBLogDeliveryServiceGetBucketAcl
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !Sub arn:aws:s3:::${ALBLogsBucket}

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: ALBLogsBucketPolicy
    Properties:
      Name: !Sub ${EnvironmentName}-alb
      Type: application
      Scheme: internet-facing
      Subnets:
        - !Ref PublicSubnet
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup
      LoadBalancerAttributes:
        - Key: access_logs.s3.enabled
          Value: 'true'
        - Key: access_logs.s3.bucket
          Value: !Ref ALBLogsBucket
        - Key: access_logs.s3.prefix
          Value: alb-logs
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-alb

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${EnvironmentName}-tg
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: instance
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-tg

  # Only listener; nothing can reach port 80 (see ALB SG ingress above).
  ALBHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CustomDomainCertificate
      # Latest as of writing (verified via describe-ssl-policies): same TLS1.2/1.3
      # ciphers as -2021-06, plus PQ-hybrid key exchange.
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-PQ-2025-09
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  # Only requests carrying CloudFront's secret X-Origin-Verify header reach
  # WordPress; any other CloudFront distribution pointed here gets a 403.
  # Two rules rather than flipping the listener default: the default would
  # change before this rule exists (it Refs the listener), 403ing everything.
  ALBForwardWithOriginHeader:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBHttpsListener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values:
              - !Sub '{{resolve:secretsmanager:${OriginVerifySecret}}}'
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  ALBRejectWithoutOriginHeader:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    DependsOn: ALBForwardWithOriginHeader
    Properties:
      ListenerArn: !Ref ALBHttpsListener
      Priority: 2
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /*
      Actions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '403'
            ContentType: text/plain
            MessageBody: Forbidden

  WAFWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub ${EnvironmentName}-waf
      Description: !Sub Web ACL for ${EnvironmentName} CloudFront distribution - SQL injection and XSS protection
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      AssociationConfig:
        RequestBody:
          CLOUDFRONT:
            DefaultSizeInspectionLimit: KB_64
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub ${EnvironmentName}-waf
      Rules:
        - Name: AWS-AWSManagedRulesSQLiRuleSet
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesSQLiRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub ${EnvironmentName}-waf-sqli
        - Name: AWS-AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              # Both blocked real content too; Counted, not disabled (see below).
              RuleActionOverrides:
                - Name: SizeRestrictions_BODY
                  ActionToUse:
                    Count: {}
                - Name: CrossSiteScripting_BODY
                  ActionToUse:
                    Count: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub ${EnvironmentName}-waf-common
        - Name: BlockXSSBodyExceptRestApi
          Priority: 2
          Action:
            Block: {}
          Statement:
            AndStatement:
              Statements:
                - LabelMatchStatement:
                    Scope: LABEL
                    Key: awswaf:managed:aws:core-rule-set:CrossSiteScripting_Body
                # Prefixes, not CONTAINS: /wp-comments-post.php/wp-json/wp/v2/x would
                # match CONTAINS. /index.php/... is the plain-permalink form in use.
                - NotStatement:
                    Statement:
                      OrStatement:
                        Statements:
                          - ByteMatchStatement:
                              SearchString: /wp-json/wp/v2/
                              FieldToMatch:
                                UriPath: {}
                              TextTransformations:
                                - Priority: 0
                                  Type: NONE
                              PositionalConstraint: STARTS_WITH
                          - ByteMatchStatement:
                              SearchString: /index.php/wp-json/wp/v2/
                              FieldToMatch:
                                UriPath: {}
                              TextTransformations:
                                - Priority: 0
                                  Type: NONE
                              PositionalConstraint: STARTS_WITH
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub ${EnvironmentName}-waf-xss-body-block
        # Brute-force guard: per-IP cap on the two login endpoints only.
        - Name: RateLimitLoginAndXmlRpc
          Priority: 3
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 100
              EvaluationWindowSec: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                OrStatement:
                  Statements:
                    - ByteMatchStatement:
                        SearchString: /wp-login.php
                        FieldToMatch:
                          UriPath: {}
                        TextTransformations:
                          - Priority: 0
                            Type: LOWERCASE
                        PositionalConstraint: STARTS_WITH
                    - ByteMatchStatement:
                        SearchString: /xmlrpc.php
                        FieldToMatch:
                          UriPath: {}
                        TextTransformations:
                          - Priority: 0
                            Type: LOWERCASE
                        PositionalConstraint: STARTS_WITH
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub ${EnvironmentName}-waf-login-rate
        # Count first, not Block: review the WAF logs for false positives on
        # real traffic before switching OverrideAction to None.
        - Name: AWS-AWSManagedRulesKnownBadInputsRuleSet
          Priority: 4
          OverrideAction:
            Count: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub ${EnvironmentName}-waf-bad-inputs
        - Name: AWS-AWSManagedRulesWordPressRuleSet
          Priority: 5
          OverrideAction:
            Count: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesWordPressRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub ${EnvironmentName}-waf-wordpress
        - Name: AWS-AWSManagedRulesPHPRuleSet
          Priority: 6
          OverrideAction:
            Count: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesPHPRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub ${EnvironmentName}-waf-php
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-waf

  # WAF requires the aws-waf-logs- name prefix, and us-east-1 for CLOUDFRONT scope.
  WAFLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub aws-waf-logs-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  WAFLoggingConfiguration:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      ResourceArn: !GetAtt WAFWebACL.Arn
      # Log group ARN without the trailing :* that GetAtt Arn returns.
      LogDestinationConfigs:
        - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${WAFLogGroup}
      # WordPress auth/session cookies would otherwise be logged in full.
      RedactedFields:
        - SingleHeader:
            Name: cookie
        - SingleHeader:
            Name: authorization

  CustomDomainCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref CustomDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref CustomDomainName
          HostedZoneId: !Ref Route53HostedZoneId
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-${CustomDomainName}

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${EnvironmentName} WordPress site, fronted by WAF
        PriceClass: !Ref CloudFrontPriceClass
        HttpVersion: http2
        WebACLId: !GetAtt WAFWebACL.Arn
        Aliases:
          - !Ref CustomDomainName
        Origins:
          - Id: ALBOrigin
            DomainName: !GetAtt ApplicationLoadBalancer.DNSName
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Sub '{{resolve:secretsmanager:${OriginVerifySecret}}}'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPPort: 80
              HTTPSPort: 443
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: ALBOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          CachedMethods:
            - GET
            - HEAD
          # Managed policy "CachingDisabled"
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # "AllViewerAndCloudFrontHeaders-2022-06" - avoids a /wp-admin redirect loop.
          OriginRequestPolicyId: 33f36d7e-f396-46d9-90e0-52428a34d9dc
        ViewerCertificate:
          AcmCertificateArn: !Ref CustomDomainCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-cloudfront

  CustomDomainDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZoneId
      Name: !Ref CustomDomainName
      Type: A
      AliasTarget:
        # Fixed AWS-wide hosted zone ID for any CloudFront distribution.
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false

  CustomDomainDNSRecordIPv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZoneId
      Name: !Ref CustomDomainName
      Type: AAAA
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false

  EFSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow NFS access from the WordPress web servers
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref WebServerSecurityGroup
          Description: NFS access from the WordPress web servers
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-efs-sg

  EFSFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: bursting
      BackupPolicy:
        Status: DISABLED
      FileSystemTags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-efs

  EFSMountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EFSFileSystem
      SubnetId: !Ref PublicSubnet
      SecurityGroups:
        - !Ref EFSSecurityGroup

  EFSMountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EFSFileSystem
      SubnetId: !Ref PublicSubnet2
      SecurityGroups:
        - !Ref EFSSecurityGroup

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow Redis access from the WordPress web servers
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref WebServerSecurityGroup
          Description: Redis access from the WordPress web servers
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-redis-sg

  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: !Sub Subnet group for ${EnvironmentName} Redis cache
      SubnetIds:
        - !Ref PrivateSubnet
        - !Ref PrivateSubnet2

  # AWS::ElastiCache::CacheCluster doesn't support TransitEncryptionEnabled/
  # AtRestEncryptionEnabled/AuthToken at all (confirmed live: CFN rejects them as
  # "extraneous key") - those only exist on ReplicationGroup, even for a single
  # node with no read replica (NumCacheClusters: 1 = primary only).
  # No explicit ReplicationGroupId: encryption is a createOnlyProperty, so any
  # future change here replaces this resource - a hardcoded name would collide
  # with the old one during CFN's create-before-delete ordering (same reason
  # DBInstance never sets an explicit identifier).
  RedisReplicationGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: !Sub ${EnvironmentName} Redis object cache
      Engine: redis
      EngineVersion: !Ref RedisEngineVersion
      CacheNodeType: !Ref RedisNodeType
      NumCacheClusters: 1
      # Live-confirmed: AutomaticFailoverEnabled effectively defaults to true
      # (CREATE_FAILED: "automatic failover ... at least 2 cache clusters"),
      # despite the CFN resource schema listing false as its default. This is a
      # single-node object cache with no replica by design - explicitly off.
      AutomaticFailoverEnabled: false
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      SecurityGroupIds:
        - !Ref RedisSecurityGroup
      TransitEncryptionEnabled: true
      AtRestEncryptionEnabled: true
      AuthToken: !Sub '{{resolve:secretsmanager:${RedisAuthSecret}:SecretString:token}}'
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-redis

  CloudWatchAgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-cw-agent-role
      Policies:
        - PolicyName: ReadDBMasterSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DBMasterSecret
                  - !Ref DBAppUserSecret
                  - !Ref RedisAuthSecret
      # Required: the deploy role can only grant permissions within this boundary.
      PermissionsBoundary:
        Fn::ImportValue: !Sub ${EnvironmentName}-pipeline-app-role-boundary-arn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy

  CloudWatchAgentInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref CloudWatchAgentRole

  HttpdErrorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${EnvironmentName}/httpd-error
      RetentionInDays: !Ref LogRetentionDays

  CloudInitLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${EnvironmentName}/cloud-init-output
      RetentionInDays: !Ref LogRetentionDays

  WebServerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    # DB/Redis/log-group resources omitted (implicit via Ref/GetAtt in UserData, cfn-lint W3005).
    DependsOn:
      - EFSMountTarget1
      - EFSMountTarget2
    Properties:
      LaunchTemplateName: !Sub ${EnvironmentName}-wordpress-lt
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref WebServerInstanceType
        KeyName: !Ref KeyPairName
        IamInstanceProfile:
          Arn: !GetAtt CloudWatchAgentInstanceProfile.Arn
        SecurityGroupIds:
          - !Ref WebServerSecurityGroup
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub ${EnvironmentName}-wordpress
        UserData:
          Fn::Base64:
            !Sub |
              #!/bin/bash -xe
              # cfn-signal first, so any later failure is reported to CloudFormation at
              # once (the ERR trap) instead of it waiting out the signal timeout.
              dnf install -y aws-cfn-bootstrap
              trap '/opt/aws/bin/cfn-signal -e 1 --stack ${AWS::StackName} --resource WebServerAutoScalingGroup --region ${AWS::Region} || true' ERR
              dnf update -y
              dnf install -y httpd php8.3 php8.3-mysqlnd php8.3-fpm php8.3-gd php8.3-xml php8.3-mbstring php8.3-pecl-redis6 mariadb105 amazon-efs-utils amazon-cloudwatch-agent wget unzip

              mkdir -p /opt/aws/amazon-cloudwatch-agent/etc
              cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json <<'CWAGENTEOF'
              {
                "logs": {
                  "logs_collected": {
                    "files": {
                      "collect_list": [
                        {
                          "file_path": "/var/log/httpd/error_log",
                          "log_group_name": "${HttpdErrorLogGroup}",
                          "log_stream_name": "{instance_id}"
                        },
                        {
                          "file_path": "/var/log/cloud-init-output.log",
                          "log_group_name": "${CloudInitLogGroup}",
                          "log_stream_name": "{instance_id}"
                        }
                      ]
                    }
                  }
                }
              }
              CWAGENTEOF

              /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
                -a fetch-config -m ec2 -s \
                -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json

              systemctl enable --now php-fpm
              systemctl start httpd
              systemctl enable httpd

              cd /tmp
              wget -q https://wordpress.org/latest.tar.gz
              tar -xzf latest.tar.gz

              cp -r wordpress/* /var/www/html/
              cd /var/www/html
              cp wp-config-sample.php wp-config.php

              # The DB password never appears in UserData: this script fetches it
              # from Secrets Manager into a PHP file outside the web root, and a
              # 1-minute timer re-runs it so a rotated password is picked up
              # without replacing instances. Output is never echoed (-x safe).
              mkdir -p /etc/wordpress
              cat > /usr/local/bin/refresh-db-secret <<'REFRESHEOF'
              #!/bin/bash
              set -euo pipefail
              pw=$(aws secretsmanager get-secret-value --region ${AWS::Region} \
                --secret-id ${DBMasterSecret} --query SecretString --output text \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["password"])')
              tmp=$(mktemp /etc/wordpress/.db-secret.XXXXXX)
              printf "<?php define( 'DB_PASSWORD', '%s' );\n" "$pw" > "$tmp"
              chown root:apache "$tmp"; chmod 640 "$tmp"
              mv -f "$tmp" /etc/wordpress/db-secret.php
              REFRESHEOF
              chmod 755 /usr/local/bin/refresh-db-secret
              /usr/local/bin/refresh-db-secret

              cat > /etc/systemd/system/refresh-db-secret.service <<'UNITEOF'
              [Unit]
              Description=Refresh WordPress DB password from Secrets Manager
              [Service]
              Type=oneshot
              ExecStart=/usr/local/bin/refresh-db-secret
              UNITEOF
              cat > /etc/systemd/system/refresh-db-secret.timer <<'UNITEOF'
              [Unit]
              Description=Refresh WordPress DB password every minute
              [Timer]
              OnBootSec=1min
              OnUnitActiveSec=1min
              [Install]
              WantedBy=timers.target
              UNITEOF
              systemctl daemon-reload
              systemctl enable --now refresh-db-secret.timer

              # Same pattern, for the least-privilege app user's own password
              # (security gap #16 - WordPress no longer connects as the master user).
              cat > /usr/local/bin/refresh-db-app-secret <<'REFRESHEOF'
              #!/bin/bash
              set -euo pipefail
              pw=$(aws secretsmanager get-secret-value --region ${AWS::Region} \
                --secret-id ${DBAppUserSecret} --query SecretString --output text \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["password"])')
              tmp=$(mktemp /etc/wordpress/.db-app-secret.XXXXXX)
              printf "<?php define( 'DB_APP_PASSWORD', '%s' );\n" "$pw" > "$tmp"
              chown root:apache "$tmp"; chmod 640 "$tmp"
              mv -f "$tmp" /etc/wordpress/db-app-secret.php
              REFRESHEOF
              chmod 755 /usr/local/bin/refresh-db-app-secret
              /usr/local/bin/refresh-db-app-secret

              cat > /etc/systemd/system/refresh-db-app-secret.service <<'UNITEOF'
              [Unit]
              Description=Refresh WordPress app DB password from Secrets Manager
              [Service]
              Type=oneshot
              ExecStart=/usr/local/bin/refresh-db-app-secret
              UNITEOF
              cat > /etc/systemd/system/refresh-db-app-secret.timer <<'UNITEOF'
              [Unit]
              Description=Refresh WordPress app DB password every minute
              [Timer]
              OnBootSec=1min
              OnUnitActiveSec=1min
              [Install]
              WantedBy=timers.target
              UNITEOF
              systemctl daemon-reload
              systemctl enable --now refresh-db-app-secret.timer

              # Idempotent: safe to re-run on every boot. Uses the master credentials
              # every instance already has to create the least-privilege app user
              # WordPress will actually connect as - SELECT/INSERT/UPDATE/DELETE plus
              # the two housekeeping grants WordPress needs, nothing admin-shaped.
              # Tracing off so neither password reaches cloud-init-output.log.
              set +x
              master_pw=$(php -r 'include "/etc/wordpress/db-secret.php"; echo DB_PASSWORD;')
              app_pw=$(php -r 'include "/etc/wordpress/db-app-secret.php"; echo DB_APP_PASSWORD;')
              export MYSQL_PWD="$master_pw"
              mysql -h ${DBInstance.Endpoint.Address} -u '${DBUsername}' -e "
                CREATE USER IF NOT EXISTS '${DBAppUsername}'@'%' IDENTIFIED BY '$app_pw';
                ALTER USER '${DBAppUsername}'@'%' IDENTIFIED BY '$app_pw';
                GRANT SELECT, INSERT, UPDATE, DELETE, CREATE TEMPORARY TABLES, LOCK TABLES ON \`${DBName}\`.* TO '${DBAppUsername}'@'%';
              " || echo "app DB user provisioning failed (attempt $i/1) - will retry on next boot/instance"
              unset MYSQL_PWD master_pw app_pw
              set -x

              # Same pattern as the DB password: the Redis AUTH token never appears
              # in UserData, and a 1-minute timer picks up a rotated token without
              # replacing instances.
              cat > /usr/local/bin/refresh-redis-secret <<'REFRESHEOF'
              #!/bin/bash
              set -euo pipefail
              tok=$(aws secretsmanager get-secret-value --region ${AWS::Region} \
                --secret-id ${RedisAuthSecret} --query SecretString --output text \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
              tmp=$(mktemp /etc/wordpress/.redis-secret.XXXXXX)
              printf "<?php define( 'WP_REDIS_PASSWORD', '%s' );\n" "$tok" > "$tmp"
              chown root:apache "$tmp"; chmod 640 "$tmp"
              mv -f "$tmp" /etc/wordpress/redis-secret.php
              REFRESHEOF
              chmod 755 /usr/local/bin/refresh-redis-secret
              /usr/local/bin/refresh-redis-secret

              cat > /etc/systemd/system/refresh-redis-secret.service <<'UNITEOF'
              [Unit]
              Description=Refresh WordPress Redis AUTH token from Secrets Manager
              [Service]
              Type=oneshot
              ExecStart=/usr/local/bin/refresh-redis-secret
              UNITEOF
              cat > /etc/systemd/system/refresh-redis-secret.timer <<'UNITEOF'
              [Unit]
              Description=Refresh WordPress Redis AUTH token every minute
              [Timer]
              OnBootSec=1min
              OnUnitActiveSec=1min
              [Install]
              WantedBy=timers.target
              UNITEOF
              systemctl daemon-reload
              systemctl enable --now refresh-redis-secret.timer

              sed -i "s/database_name_here/${DBName}/" wp-config.php
              sed -i "s/username_here/${DBUsername}/" wp-config.php
              sed -i "/'DB_PASSWORD'/c\\require '/etc/wordpress/db-secret.php';" wp-config.php
              sed -i "s/localhost/${DBInstance.Endpoint.Address}/" wp-config.php

              # Redundant now the ALB origin is HTTPS, kept as a defensive fallback.
              cat > /tmp/https-proxy-fix.php <<'PHPSNIPPET'
              if ( isset( $_SERVER['HTTP_CLOUDFRONT_FORWARDED_PROTO'] ) && $_SERVER['HTTP_CLOUDFRONT_FORWARDED_PROTO'] === 'https' ) {
              	$_SERVER['HTTPS'] = 'on';
              }
              PHPSNIPPET
              sed -i "/Add any custom values between this line/r /tmp/https-proxy-fix.php" wp-config.php
              rm -f /tmp/https-proxy-fix.php

              # Stage 1 of TLS in transit (security gap #2): force every wpdb mysqli
              # connection (both HyperDB entries, primary and replica) to use TLS.
              # require_secure_transport isn't enabled on RDS yet - that's stage 2,
              # only after this is confirmed live with a real Ssl_cipher check.
              cat > /tmp/db-tls-fix.php <<'PHPSNIPPET'
              define( 'MYSQL_CLIENT_FLAGS', MYSQLI_CLIENT_SSL );
              PHPSNIPPET
              sed -i "/Add any custom values between this line/r /tmp/db-tls-fix.php" wp-config.php
              rm -f /tmp/db-tls-fix.php

              mkdir -p /mnt/efs-seed
              for i in 1 2 3 4 5 6; do
                mount -t efs -o tls ${EFSFileSystem}:/ /mnt/efs-seed && break
                sleep 10
              done
              if [ -z "$(ls -A /mnt/efs-seed)" ]; then
                cp -a /var/www/html/wp-content/. /mnt/efs-seed/
              fi
              umount /mnt/efs-seed

              echo "${EFSFileSystem}:/ /var/www/html/wp-content efs _netdev,tls 0 0" >> /etc/fstab
              mount -a

              cd /tmp
              wget -q https://downloads.wordpress.org/plugin/hyperdb.zip
              unzip -q -o hyperdb.zip
              cp hyperdb/db.php /var/www/html/wp-content/db.php

              cat > /var/www/html/db-config.php <<DBCONFIGEOF
              <?php
              require '/etc/wordpress/db-app-secret.php';
              \$wpdb->add_database(array(
                  'host'     => '${DBInstance.Endpoint.Address}',
                  'user'     => '${DBAppUsername}',
                  'password' => DB_APP_PASSWORD,
                  'name'     => '${DBName}',
                  'write'    => 1,
                  'read'     => 0,
                  'dataset'  => 'global',
                  'timeout'  => 0.2,
              ));

              \$wpdb->add_database(array(
                  'host'     => '${DBReadReplica.Endpoint.Address}',
                  'user'     => '${DBAppUsername}',
                  'password' => DB_APP_PASSWORD,
                  'name'     => '${DBName}',
                  'write'    => 0,
                  'read'     => 1,
                  'dataset'  => 'global',
                  'timeout'  => 0.2,
              ));
              DBCONFIGEOF

              # Two Factor lives on EFS, which a stack rebuild recreates empty - install it
              # here so 2FA survives (the DB snapshot keeps it active and users' settings).
              if [ ! -d /var/www/html/wp-content/plugins/two-factor ]; then
                cd /tmp
                wget -q https://downloads.wordpress.org/plugin/two-factor.zip
                unzip -q -o two-factor.zip -d /var/www/html/wp-content/plugins/
              fi

              cd /tmp
              wget -q https://downloads.wordpress.org/plugin/redis-cache.zip
              unzip -q -o redis-cache.zip
              cp redis-cache/includes/object-cache.php /var/www/html/wp-content/object-cache.php

              cat > /tmp/redis-config.php <<'PHPSNIPPET'
              define( 'WP_REDIS_HOST', '${RedisReplicationGroup.PrimaryEndPoint.Address}' );
              define( 'WP_REDIS_PORT', ${RedisReplicationGroup.PrimaryEndPoint.Port} );
              define( 'WP_REDIS_SCHEME', 'tls' );
              require '/etc/wordpress/redis-secret.php';
              PHPSNIPPET
              sed -i "/Add any custom values between this line/r /tmp/redis-config.php" /var/www/html/wp-config.php
              rm -f /tmp/redis-config.php

              # Pass Authorization through to PHP-FPM (WordPress Application Passwords,
              # used by scripts/wp_content.py). WordPress's .htaccess normally does
              # this, but plain permalinks have no .htaccess.
              cat > /etc/httpd/conf.d/wordpress-auth.conf <<'HTTPDEOF'
              <Directory "/var/www/html">
                  CGIPassAuth On
              </Directory>
              HTTPDEOF

              chown -R apache:apache /var/www/html
              chmod -R 755 /var/www/html

              systemctl restart httpd

              # Ready = both DB endpoints accept the app user's password AND WordPress
              # answers. Checks the app user, not master - that's what WordPress
              # actually connects as, so it's the credential that matters here (same
              # "verify the real dependency" reasoning as everywhere else in this
              # file). A page load alone isn't proof: the Redis object cache can serve
              # pages with a dead DB. Retries for up to 10 min, since scripts/stack.sh up
              # sets a restored DB's password while instances may already be booting.
              # Tracing off so the password never reaches cloud-init-output.log.
              set +x
              ready=false
              for i in $(seq 1 20); do
                export MYSQL_PWD=$(php -r 'include "/etc/wordpress/db-app-secret.php"; echo DB_APP_PASSWORD;')
                if mysql -h ${DBInstance.Endpoint.Address} -u '${DBAppUsername}' -N -e 'SELECT 1' >/dev/null 2>&1 \
                   && mysql -h ${DBReadReplica.Endpoint.Address} -u '${DBAppUsername}' -N -e 'SELECT 1' >/dev/null 2>&1 \
                   && curl -s -f -o /dev/null http://localhost/; then
                  ready=true; break
                fi
                echo "not ready yet (attempt $i/20): DB login or local WordPress check failed"
                sleep 30
              done
              unset MYSQL_PWD
              set -x
              $ready
              /opt/aws/bin/cfn-signal -e 0 --stack ${AWS::StackName} --resource WebServerAutoScalingGroup --region ${AWS::Region} \
                || echo "cfn-signal not accepted - normal outside a stack create/update (e.g. an ASG health replacement)"

  WebServerAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    # Each new instance signals when it can really log in to the DB (end of
    # UserData), so updates move on as soon as it's ready and roll back if it
    # never is. PauseTime is now that signal's timeout, not a fixed wait.
    CreationPolicy:
      ResourceSignal:
        Count: !Ref AsgDesiredCapacity
        Timeout: PT20M
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: !Ref AsgMinSize
        MaxBatchSize: 1
        WaitOnResourceSignals: true
        PauseTime: PT20M
    Properties:
      AutoScalingGroupName: !Sub ${EnvironmentName}-asg
      VPCZoneIdentifier:
        - !Ref PublicSubnet
        - !Ref PublicSubnet2
      LaunchTemplate:
        LaunchTemplateId: !Ref WebServerLaunchTemplate
        Version: !GetAtt WebServerLaunchTemplate.LatestVersionNumber
      MinSize: !Ref AsgMinSize
      MaxSize: !Ref AsgMaxSize
      DesiredCapacity: !Ref AsgDesiredCapacity
      TargetGroupARNs:
        - !Ref ALBTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-wordpress
          PropagateAtLaunch: true

  # Stage 1 of security gap #2 (TLS in transit): just the parameter group,
  # require_secure_transport left unset (engine default) until WordPress's own
  # connections are confirmed using TLS - see "Least-privilege WordPress DB
  # user" / TLS verification notes in Deployment.md. Enforcing it before that's
  # confirmed would reject every existing connection immediately.
  DBParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: !Sub mysql${DBEngineVersion}
      Description: !Sub ${EnvironmentName} MySQL parameter group (TLS rollout, gap #2)

  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBName: !If [RestoreFromSnapshot, !Ref 'AWS::NoValue', !Ref DBName]
      Engine: mysql
      EngineVersion: !Ref DBEngineVersion
      AllowMajorVersionUpgrade: true # required to cross the 8.0->8.4 boundary
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      MasterUsername: !Ref DBUsername
      # Never change DBMasterSecret's value and this reference in one deploy: the
      # first rotation did, and RDS ended up on a different password than the
      # secret. Rotate out of band instead ("Rotate the DB password", Deployment.md).
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DBMasterSecret}:SecretString:password:AWSCURRENT}}'
      DBSnapshotIdentifier: !If [RestoreFromSnapshot, !Ref DBSnapshotIdentifier, !Ref 'AWS::NoValue']
      DBParameterGroupName: !Ref DBParameterGroup
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      AvailabilityZone: !Ref AvailabilityZone
      MultiAZ: false
      PubliclyAccessible: false
      StorageType: gp3
      BackupRetentionPeriod: !Ref DBBackupRetentionPeriod
      # Stack deletion needs this set to false first (see Deployment.md).
      DeletionProtection: true
      EnableCloudwatchLogsExports:
        - error
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-mysql

  DBReadReplica:
    Type: AWS::RDS::DBInstance
    # No explicit DependsOn: enforced implicitly via SourceDBInstanceIdentifier.
    Properties:
      SourceDBInstanceIdentifier: !Ref DBInstance
      DeletionProtection: true
      EngineVersion: !Ref DBEngineVersion
      AllowMajorVersionUpgrade: true
      DBInstanceClass: !Ref DBInstanceClass
      DBParameterGroupName: !Ref DBParameterGroup
      AvailabilityZone: !Ref SecondAvailabilityZone
      PubliclyAccessible: false
      StorageType: gp3
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-mysql-read-replica

  RdsLogRetentionFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-rds-log-retention-role
      # Required: the deploy role can only grant permissions within this boundary.
      PermissionsBoundary:
        Fn::ImportValue: !Sub ${EnvironmentName}-pipeline-app-role-boundary-arn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SetLogRetention
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: logs:PutRetentionPolicy
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/rds/instance/*
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${EnvironmentName}-rds-log-retention:*

  RdsLogRetentionFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-rds-log-retention
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt RdsLogRetentionFunctionRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import json
          import time
          import urllib.request
          import boto3

          def handler(event, context):
              physical_id = event.get('PhysicalResourceId', 'RdsLogRetention')
              response_data = {}
              try:
                  if event['RequestType'] in ('Create', 'Update'):
                      log_group = event['ResourceProperties']['LogGroupName']
                      retention = int(event['ResourceProperties']['RetentionInDays'])
                      client = boto3.client('logs')
                      for attempt in range(10):
                          try:
                              client.put_retention_policy(logGroupName=log_group, retentionInDays=retention)
                              break
                          except client.exceptions.ResourceNotFoundException:
                              time.sleep(6)
                      else:
                          raise Exception('Log group %s never appeared' % log_group)
                  send(event, context, 'SUCCESS', response_data, physical_id)
              except Exception as e:
                  response_data['Error'] = str(e)
                  send(event, context, 'FAILED', response_data, physical_id)

          def send(event, context, status, data, physical_id):
              body = json.dumps({
                  'Status': status,
                  'Reason': 'See CloudWatch Logs: ' + context.log_stream_name,
                  'PhysicalResourceId': physical_id,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data
              }).encode('utf-8')
              req = urllib.request.Request(event['ResponseURL'], data=body, method='PUT', headers={'Content-Type': ''})
              urllib.request.urlopen(req)

  DBErrorLogRetention:
    Type: Custom::SetRdsLogRetention
    # No explicit DependsOn: enforced implicitly via LogGroupName (cfn-lint W3005).
    Properties:
      ServiceToken: !GetAtt RdsLogRetentionFunction.Arn
      LogGroupName: !Sub /aws/rds/instance/${DBInstance}/error
      RetentionInDays: !Ref LogRetentionDays

  BackupVault:
    Type: AWS::Backup::BackupVault
    Properties:
      BackupVaultName: !Sub ${EnvironmentName}-backup-vault
      BackupVaultTags:
        Name: !Sub ${EnvironmentName}-backup-vault

  BackupPlan:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: !Sub ${EnvironmentName}-backup-plan
        BackupPlanRule:
          - RuleName: Daily
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: !Ref BackupScheduleExpression
            Lifecycle:
              DeleteAfterDays: !Ref BackupRetentionDays

  BackupSelection:
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !Ref BackupPlan
      BackupSelection:
        # Renamed with the role move: replacement creates the new selection before
        # deleting the old, and Backup rejects an identical duplicate.
        SelectionName: !Sub ${EnvironmentName}-backup-selection-v2
        IamRoleArn:
          Fn::ImportValue: !Sub ${EnvironmentName}-pipeline-backup-role-arn
        Resources:
          - !GetAtt DBInstance.DBInstanceArn
          - !GetAtt EFSFileSystem.Arn
        ListOfTags:
          - ConditionType: STRINGEQUALS
            ConditionKey: Name
            ConditionValue: !Sub ${EnvironmentName}-wordpress

  CloudWatchDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${EnvironmentName}-dashboard
      DashboardBody:
        !Sub |
          {
            "widgets": [
              {
                "type": "metric",
                "x": 0,
                "y": 0,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "EC2 CPUUtilization (Auto Scaling Group)",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "stacked": false,
                  "period": 300,
                  "metrics": [
                    [ "AWS/EC2", "CPUUtilization", "AutoScalingGroupName", "${WebServerAutoScalingGroup}", { "stat": "Average", "label": "Average CPU %" } ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 12,
                "y": 0,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "RDS CPUUtilization",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "stacked": false,
                  "period": 300,
                  "metrics": [
                    [ "AWS/RDS", "CPUUtilization", "DBInstanceIdentifier", "${DBInstance}", { "stat": "Average", "label": "Average CPU %" } ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 6,
                "width": 24,
                "height": 6,
                "properties": {
                  "title": "ALB RequestCount",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "stacked": false,
                  "period": 300,
                  "metrics": [
                    [ "AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${ApplicationLoadBalancer.LoadBalancerFullName}", { "stat": "Sum", "label": "Total Requests" } ]
                  ]
                }
              }
            ]
          }

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub ${EnvironmentName}-vpc-id

  PublicSubnetId:
    Description: Public subnet ID
    Value: !Ref PublicSubnet
    Export:
      Name: !Sub ${EnvironmentName}-public-subnet-id

  PrivateSubnetId:
    Description: Private subnet ID
    Value: !Ref PrivateSubnet
    Export:
      Name: !Sub ${EnvironmentName}-private-subnet-id

  PublicRouteTableId:
    Description: Public route table ID
    Value: !Ref PublicRouteTable
    Export:
      Name: !Sub ${EnvironmentName}-public-rt-id

  PrivateRouteTableId:
    Description: Private route table ID
    Value: !Ref PrivateRouteTable
    Export:
      Name: !Sub ${EnvironmentName}-private-rt-id

  PublicSubnet2Id:
    Description: Second public subnet ID (ALB, ASG)
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub ${EnvironmentName}-public-subnet-2-id

  PrivateSubnet2Id:
    Description: Second private subnet ID (DB subnet group)
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub ${EnvironmentName}-private-subnet-2-id

  DBSubnetGroupName:
    Description: RDS DB subnet group name
    Value: !Ref DBSubnetGroup
    Export:
      Name: !Sub ${EnvironmentName}-db-subnet-group

  DBSecurityGroupId:
    Description: Security group ID for the RDS instance
    Value: !Ref DBSecurityGroup
    Export:
      Name: !Sub ${EnvironmentName}-db-sg-id

  DBInstanceEndpoint:
    Description: RDS instance connection endpoint
    Value: !GetAtt DBInstance.Endpoint.Address
    Export:
      Name: !Sub ${EnvironmentName}-db-endpoint

  DBInstancePort:
    Description: RDS instance connection port
    Value: !GetAtt DBInstance.Endpoint.Port
    Export:
      Name: !Sub ${EnvironmentName}-db-port

  DBReadReplicaEndpoint:
    Description: RDS read replica endpoint (HyperDB reads)
    Value: !GetAtt DBReadReplica.Endpoint.Address
    Export:
      Name: !Sub ${EnvironmentName}-db-replica-endpoint

  DBReadReplicaPort:
    Description: RDS read replica connection port
    Value: !GetAtt DBReadReplica.Endpoint.Port

  WebServerSecurityGroupId:
    Description: Web server security group ID
    Value: !Ref WebServerSecurityGroup
    Export:
      Name: !Sub ${EnvironmentName}-web-sg-id

  ALBSecurityGroupId:
    Description: ALB security group ID
    Value: !Ref ALBSecurityGroup
    Export:
      Name: !Sub ${EnvironmentName}-alb-sg-id

  LoadBalancerDNSName:
    Description: ALB's DNS name (not internet-reachable)
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  AutoScalingGroupName:
    Description: Name of the WordPress Auto Scaling Group
    Value: !Ref WebServerAutoScalingGroup

  CloudFrontDomainName:
    Description: CloudFront's default cloudfront.net domain
    Value: !GetAtt CloudFrontDistribution.DomainName

  CloudFrontDistributionId:
    Description: CloudFront distribution ID
    Value: !Ref CloudFrontDistribution

  WAFWebACLArn:
    Description: WAF ACL ARN
    Value: !GetAtt WAFWebACL.Arn

  CustomDomainCertificateArn:
    Description: ACM certificate ARN for CustomDomainName
    Value: !Ref CustomDomainCertificate

  WordPressURL:
    Description: WordPress site URL (via CloudFront + WAF)
    Value: !Sub https://${CustomDomainName}

  EFSFileSystemId:
    Description: EFS file system ID (mounted at wp-content)
    Value: !Ref EFSFileSystem
    Export:
      Name: !Sub ${EnvironmentName}-efs-id

  EFSSecurityGroupId:
    Description: Security group ID for the EFS mount targets
    Value: !Ref EFSSecurityGroup
    Export:
      Name: !Sub ${EnvironmentName}-efs-sg-id

  RedisEndpoint:
    Description: Redis endpoint used as WordPress's object cache
    Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Address

  BackupVaultName:
    Description: AWS Backup vault name
    Value: !Ref BackupVault

  BackupPlanId:
    Description: AWS Backup plan ID
    Value: !GetAtt BackupPlan.BackupPlanId

  CloudWatchDashboardURL:
    Description: CloudWatch dashboard URL
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${CloudWatchDashboard}

  CfnArtifactsBucketName:
    Description: S3 bucket deploy.yml uploads the template to
    Value: !Ref CfnArtifactsBucket

  ALBLogsBucketName:
    Description: S3 bucket receiving ALB access logs
    Value: !Ref ALBLogsBucket
    Export:
      Name: !Sub ${EnvironmentName}-alb-logs-bucket

  HttpdErrorLogGroupName:
    Description: CloudWatch Logs group for Apache error_log
    Value: !Ref HttpdErrorLogGroup

  CloudInitLogGroupName:
    Description: CloudWatch Logs group for cloud-init-output.log
    Value: !Ref CloudInitLogGroup
