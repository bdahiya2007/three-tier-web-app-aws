name: Deploy CloudFormation Stack

# Authenticates via GitHub OIDC - no long-lived AWS credentials stored in this repo.
# GitHub Actions assumes AWS_DEPLOY_ROLE_ARN directly; AWS trusts the request based
# on a short-lived token whose "sub" claim is checked against this exact repo +
# branch (see GitHubActionsDeployRole in cloudformation/pipeline.yaml - a separate,
# manually deployed stack, so this workflow can never modify its own permissions).
#
# PR-time validation lives in validate.yml, a fully separate workflow (not a job
# here gated by an `if:`) - see that file's header for why it's kept separate
# rather than a job in this one.
#
# Required GitHub repository secrets (Settings -> Secrets and variables -> Actions):
#   AWS_DEPLOY_ROLE_ARN - the DeployRoleArn output of the pipeline stack, e.g.
#                         arn:aws:iam::<account-id>:role/three-tier-app-pipeline-deploy-role
#   KEY_PAIR_NAME       - name of an existing EC2 key pair in us-east-1 (CloudFormation KeyPairName parameter)

on:
  push:
    branches:
      - main
    # Blog content backups (content-backup.yml) don't touch AWS; a merge that
    # only changes content/ shouldn't queue a production deploy for approval.
    paths-ignore:
      - 'content/**'

concurrency:
  group: cloudformation-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: three-tier-app-network
  TEMPLATE_FILE: cloudformation/vpc.yaml

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    # Requires manual approval (production environment, configured with
    # bdahiya2007 as required reviewer via the GitHub API - not in this file,
    # since environment protection rules aren't expressible in workflow YAML).
    # A push to main triggers the run, but it pauses here until approved from
    # the Actions tab, even after the merge itself already happened.
    environment: production
    permissions:
      id-token: write # required to request the OIDC token
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Templates go via S3 (TemplateURL, 1 MB limit) instead of inline
      # TemplateBody (51,200 bytes, which this template outgrew). The bucket
      # is the stack's own CfnArtifactsBucket.
      - name: Upload and validate CloudFormation template
        run: |
          bucket=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='CfnArtifactsBucketName'].OutputValue" \
            --output text)
          test -n "$bucket" && test "$bucket" != "None"
          echo "ARTIFACTS_BUCKET=$bucket" >> "$GITHUB_ENV"
          key="validate/${{ github.sha }}.yaml"
          aws s3 cp ${{ env.TEMPLATE_FILE }} "s3://$bucket/$key" --region ${{ env.AWS_REGION }}
          aws cloudformation validate-template \
            --template-url "https://$bucket.s3.amazonaws.com/$key" \
            --region ${{ env.AWS_REGION }}

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file ${{ env.TEMPLATE_FILE }} \
            --s3-bucket "$ARTIFACTS_BUCKET" \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              KeyPairName=${{ secrets.KEY_PAIR_NAME }}

      - name: Show stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs" \
            --output table
