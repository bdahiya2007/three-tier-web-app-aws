name: Deploy CloudFormation Stack

# Authenticates via GitHub OIDC - no long-lived AWS credentials stored in this repo.
# GitHub Actions assumes AWS_DEPLOY_ROLE_ARN directly; AWS trusts the
# request based on a short-lived token whose "sub" claim is checked against this
# exact repo + branch (see GitHubActionsDeployRole in cloudformation/vpc.yaml).
#
# Split into two jobs so pull requests never need AWS credentials at all:
#   validate - runs on every PR targeting main. Offline cfn-lint only, no AWS
#              credentials - a PR-triggered OIDC token has a different "sub" claim
#              shape than a push (repo:org/repo:pull_request vs. .../ref/heads/main),
#              which GitHubActionsDeployRole's trust policy deliberately does not
#              authorize, so this job intentionally never attempts to assume it.
#   deploy   - runs on push to main (i.e. after a PR merges). Authenticates via
#              OIDC and applies the stack.
#
# Required GitHub repository secrets (Settings -> Secrets and variables -> Actions):
#   AWS_DEPLOY_ROLE_ARN - the GitHubActionsDeployRoleArn stack output, e.g.
#                         arn:aws:iam::<account-id>:role/three-tier-app-github-actions-deploy-role
#   DB_PASSWORD         - value for the CloudFormation DBPassword parameter (8-41 chars, no / @ " or spaces)
#   KEY_PAIR_NAME       - name of an existing EC2 key pair in us-east-1 (CloudFormation KeyPairName parameter)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: cloudformation-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: three-tier-app-network
  TEMPLATE_FILE: cloudformation/vpc.yaml

jobs:
  validate:
    name: Validate CloudFormation template (cfn-lint)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Lint CloudFormation template
        run: cfn-lint ${{ env.TEMPLATE_FILE }}

  deploy:
    name: Deploy to AWS
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to request the OIDC token
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://${{ env.TEMPLATE_FILE }} \
            --region ${{ env.AWS_REGION }}

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file ${{ env.TEMPLATE_FILE }} \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              DBPassword=${{ secrets.DB_PASSWORD }} \
              KeyPairName=${{ secrets.KEY_PAIR_NAME }}

      - name: Show stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs" \
            --output table
